<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital E-Paper Flipbook with Perfect Zoom & Sound</title>
    <!-- PageFlip Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* माथिल्लो कन्ट्रोल बटनहरूको स्टाइल */
        .controls-bar {
            position: absolute;
            top: 10px;
            z-index: 999;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .controls-bar button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .controls-bar button:hover {
            background-color: #0056b3;
        }

        /* किताब राख्ने मुख्य ठाउँ - तलपटी नकटिने गरी उचाइ मिलाइएको */
        #book-container {
            width: 100%;
            max-width: 1000px;
            height: 82vh;
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease;
        }
        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* पेजभित्रको जुम (आइग्लास) आइकन */
        .zoom-icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            z-index: 10;
        }
        .zoom-icon:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        /* लाइटबक्स (फुल स्क्रिन जुम दृश्य) */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }
        #lightbox-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* मोबाइल र साना स्क्रिनहरूको लागि रेस्पोन्सिभ व्यवस्था */
        @media (max-width: 768px) {
            #book-container {
                width: 100vw;
                height: 75vh;
                margin-top: 30px;
            }
            .controls-bar {
                top: 5px;
                padding: 4px 10px;
            }
            .controls-bar button {
                padding: 5px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- जुम इन/आउट कन्ट्रोल बटनहरू -->
    <div class="controls-bar">
        <button onclick="zoomIn()" title="Zoom In">➕ जुम इन</button>
        <button onclick="zoomOut()" title="Zoom Out">➖ जुम आउट</button>
        <button onclick="resetZoom()" title="Reset">🔄 रिसेट</button>
    </div>

    <div id="book-container">
        <div id="flipbook">
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_1.png" alt="Cover Page">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_2.png" alt="Page 2">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_3.png" alt="Page 3">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_4.png" alt="Page 4">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_5.png" alt="Page 5">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_6.png" alt="Page 6">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
        </div>
    </div>

    <!-- फोटो ठूलो देखाउने लाइटबक्स मोडल -->
    <div id="lightbox-modal">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Page">
    </div>

    <script>
        let currentScale = 1;

        function zoomIn() {
            if (currentScale < 1.8) {
                currentScale += 0.15;
                document.getElementById('book-container').style.transform = `scale(${currentScale})`;
            }
        }

        function zoomOut() {
            if (currentScale > 0.7) {
                currentScale -= 0.15;
                document.getElementById('book-container').style.transform = `scale(${currentScale})`;
            }
        }

        function resetZoom() {
            currentScale = 1;
            document.getElementById('book-container').style.transform = `scale(1)`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            let bookWidth = 450;
            let bookHeight = 636;

            if (window.innerWidth < 768) {
                bookWidth = Math.floor((window.innerWidth * 0.92) / 2);
                bookHeight = Math.floor(bookWidth * 1.414); 
            }

            const flipBook = new St.PageFlip(
                document.getElementById('flipbook'),
                {
                    width: bookWidth, 
                    height: bookHeight, 
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true,
                    usePortrait: false
                }
            );

            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            // साउन्ड फाइलको सहि पाथ वा अनलाइन लिंक यहाँ राख्नुहोला
            const flipSound = new Audio('https://ad.neelamb.com/3d-epaper/image/flip-sound.mp3');
            
            flipBook.on('flip', (e) => {
                const soundInstance = flipSound.cloneNode();
                soundInstance.play().catch(error => {
                    console.log("Audio play error: ", error);
                });
            });
        });

        function openZoom(iconElement) {
            const pageDiv = iconElement.closest('.page');
            const imgElement = pageDiv.querySelector('img');
            
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-img');
            
            modal.style.display = 'flex';
            modalImg.src = imgElement.src;
        }

        document.getElementById('lightbox-close').addEventListener('click', function() {
            document.getElementById('lightbox-modal').style.display = 'none';
        });

        document.getElementById('lightbox-modal').addEventListener('click', function(e) {
            if(e.target === this) {
                this.style.display = 'none';
            }
        });
    </script>

</body>
</html>
