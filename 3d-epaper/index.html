<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Digital E-Paper & Archive Gallery</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; margin: 0; padding: 0; }
        
        .controls-bar {
            position: absolute;
            top: 10px;
            z-index: 999;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .controls-bar button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .controls-bar button:hover { background-color: #0056b3; }

        #book-container {
            width: 100%;
            max-width: 1000px;
            height: 75vh;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease;
        }
        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .page img { width: 100%; height: 100%; object-fit: contain; }
        
        .zoom-icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            z-index: 10;
        }
        .zoom-icon:hover { background-color: rgba(0, 0, 0, 0.9); }

        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center; align-items: center;
        }
        #lightbox-modal img { max-width: 90%; max-height: 90vh; object-fit: contain; border-radius: 4px; }
        #lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }

        .custom-title-bar {
            display: flex; align-items: center; text-align: center;
            margin: 40px auto 15px auto; max-width: 1400px; padding: 0 15px;
        }
        .custom-title-bar::before, .custom-title-bar::after { content: ''; flex: 1; border-bottom: 2px solid #000; }
        .custom-title-bar span { padding: 0 20px; font-size: 22px; font-weight: bold; color: #000; }

        .drive-page-container { max-width: 1400px; margin: 0 auto; padding: 0 15px 40px 15px; }
        .grid-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            grid-auto-rows: minmax(220px, auto);
            grid-gap: 15px;
            margin-bottom: 15px;
        }
        .grid-group .drive-card:first-child { grid-row: span 2; }
        
        .drive-card {
            background: #fff; border: 1px solid #333; display: flex;
            flex-direction: column; position: relative; overflow: hidden;
            text-decoration: none; color: inherit; transition: transform 0.2s;
        }
        .drive-card:hover { transform: scale(1.01); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .thumb-wrapper { width: 100%; height: 100%; position: relative; min-height: 180px; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .file-name-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 8px;
            font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        #load-more-btn {
            padding: 10px 25px; cursor: pointer; background: #28a745; color: #fff;
            border: none; border-radius: 5px; font-size: 15px; display: none; margin: 20px auto;
        }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <div class="text-center py-4 bg-slate-900 text-white shadow-md">
        <h1 class="text-xl md:text-2xl font-bold" id="main-epaper-title">ताजा ई-पेपर लोड हुँदैछ...</h1>
    </div>

    <div style="position: relative; display: flex; justify-content: center;">
        <div class="controls-bar">
            <button onclick="zoomIn()" title="Zoom In">➕ जुम इन</button>
            <button onclick="zoomOut()" title="Zoom Out">➖ जुम आउट</button>
            <button onclick="resetZoom()" title="Reset">🔄 रिसेट</button>
        </div>
    </div>

    <div id="book-container">
        <div id="flipbook">
            <!-- Dynamic Flipbook Pages -->
        </div>
    </div>

    <div class="drive-page-container">
        <div class="custom-title-bar">
            <span>पुराना Epaper हरू (Archive Gallery)</span>
        </div>
        <div id="main-gallery-container"></div>
        <div class="text-center">
            <button id="load-more-btn" onclick="handleLoadMore()">थप फाइलहरू हेर्नुहोस्</button>
        </div>
        <div id="status-msg" class="text-center font-bold py-4">कृपया पर्खनुहोस्, ड्राइभ डेटा लोड हुँदैछ...</div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Page">
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws6ETredBh962H75HTlkpm7eISFyIGQENm_lLq55bFwTGA5QNkOvL0MKnmlQvbeU0/exec";
        let allFiles = [];
        let displayedCount = 0;
        const BATCH_SIZE = 9;
        let currentScale = 1;
        let pageFlipInstance = null;

        function zoomIn() { if (currentScale < 1.8) { currentScale += 0.15; document.getElementById('book-container').style.transform = `scale(${currentScale})`; } }
        function zoomOut() { if (currentScale > 0.7) { currentScale -= 0.15; document.getElementById('book-container').style.transform = `scale(${currentScale})`; } }
        function resetZoom() { currentScale = 1; document.getElementById('book-container').style.transform = `scale(1)`; }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function initApp() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error("Invalid or empty data");
                }

                // नयाँदेखि पुरानोको आधारमा सर्ट गर्ने
                allFiles = data.sort((a, b) => {
                    const timeA = new Date(a.createdTime || a.date || 0).getTime();
                    const timeB = new Date(b.createdTime || b.date || 0).getTime();
                    return timeB - timeA;
                });

                document.getElementById('status-msg').style.display = 'none';

                // सबैभन्दा पछिल्लो (Latest) फाइललाई माथिल्लो फ्लिपबुकमा देखाउने
                const latestFile = allFiles[0];
                document.getElementById('main-epaper-title').innerText = `आजको ई-पेपर: ${latestFile.name}`;
                
                await createFlipbookFromDrive(latestFile.id);

                // बाँकी पुराना फाइलहरूलाई ग्यालरीमा राख्ने
                allFiles.shift(); 
                renderBatch();

            } catch (err) {
                console.error(err);
                document.getElementById('status-msg').innerHTML = "डाटा लोड गर्न सकिएन।";
                document.getElementById('main-epaper-title').innerText = "डेटा फेच गर्दा त्रुटी देखियो।";
            }
        }

        async function createFlipbookFromDrive(fileId) {
            const flipbookElem = document.getElementById('flipbook');
            flipbookElem.innerHTML = '';

            let bookWidth = 450;
            let bookHeight = 636;
            if (window.innerWidth < 768) {
                bookWidth = Math.floor((window.innerWidth * 0.92) / 2);
                bookHeight = Math.floor(bookWidth * 1.414);
            }

            // ड्राइभको हाइ-रिजोलुसन इमेज/थम्बनेल लिङ्क प्रयोग गरिएको (CORS प्रतिबन्ध नहुने गरी)
            const imageUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;

            // फ्लिपबुक अनुभवको लागि पानाहरू सिर्जना गर्ने
            for (let i = 1; i <= 2; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.innerHTML = `
                    <img src="${imageUrl}" alt="Page ${i}" onerror="this.src='https://placehold.co/600x800?text=Epaper+Page'">
                    <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
                `;
                flipbookElem.appendChild(pageDiv);
            }

            pageFlipInstance = new St.PageFlip(flipbookElem, {
                width: bookWidth,
                height: bookHeight,
                showCover: true,
                maxShadowOpacity: 0.5,
                mobileScrollSupport: true,
                usePortrait: false
            });

            pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

            // साउन्ड इफेक्ट
            const flipSound = new Audio('https://ad.neelamb.com/3d-epaper/image/flip-sound.mp3');
            pageFlipInstance.on('flip', () => {
                flipSound.cloneNode().play().catch(e => console.log("Audio block error:", e));
            });
        }

        function createCardHTML(file) {
            const safeName = escapeHTML(file.name);
            return `
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="drive-card">
                    <div class="thumb-wrapper">
                        <img src="https://drive.google.com/thumbnail?id=${file.id}&sz=w1000" 
                             alt="${safeName}" 
                             loading="lazy" 
                             onerror="this.onerror=null; this.src='https://placehold.co/400x300?text=No+Preview';">
                        <div class="file-name-overlay">${safeName}</div>
                    </div>
                </a>
            `;
        }

        function renderBatch() {
            const mainContainer = document.getElementById('main-gallery-container');
            if (!mainContainer) return;

            const nextBatch = allFiles.slice(displayedCount, displayedCount + BATCH_SIZE);
            if (nextBatch.length > 0) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'grid-group';
                groupDiv.innerHTML = nextBatch.map(createCardHTML).join('');
                mainContainer.appendChild(groupDiv);
            }

            displayedCount += nextBatch.length;
            document.getElementById('load-more-btn').style.display = (displayedCount < allFiles.length) ? 'inline-block' : 'none';
        }

        function handleLoadMore() { renderBatch(); }

        // Lightbox Functions
        function openZoom(iconElement) {
            const imgElement = iconElement.closest('.page').querySelector('img');
            const modal = document.getElementById('lightbox-modal');
            modal.style.display = 'flex';
            document.getElementById('lightbox-img').src = imgElement.src;
        }

        document.getElementById('lightbox-close').addEventListener('click', () => { document.getElementById('lightbox-modal').style.display = 'none'; });
        document.getElementById('lightbox-modal').addEventListener('click', function(e) { if(e.target === this) this.style.display = 'none'; });

        // एप सुरु गर्ने
        initApp();
    </script>
</body>
</html>
