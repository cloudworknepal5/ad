<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital E-Paper Flipbook with Zoom & Sound</title>
    <!-- PageFlip Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #book-container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            cursor: pointer; /* क्लिक गर्न मिल्छ भनेर देखाउन */
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* लाइटबक्स (फोटो ठूलो देखाउने मोडल) स्टाइल */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }
        #lightbox-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* मोबाइल र साना स्क्रिनहरूको लागि रेस्पोन्सिभ व्यवस्था */
        @media (max-width: 768px) {
            #book-container {
                width: 100vw;
                height: 75vh;
            }
        }
    </style>
</head>
<body>

    <div id="book-container">
        <div id="flipbook">
            <!-- ६ वटा पानाहरू (तपाईंको लाइभ लिङ्कसहित) -->
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_1.png" alt="Cover Page"></div>
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_2.png" alt="Page 2"></div>
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_3.png" alt="Page 3"></div>
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_4.png" alt="Page 4"></div>
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_5.png" alt="Page 5"></div>
            <div class="page"><img src="https://ad.neelamb.com/3d-epaper/image/Page_6.png" alt="Page 6"></div>
        </div>
    </div>

    <!-- फोटो ठूलो देखाउने मोडल (Lightbox) -->
    <div id="lightbox-modal">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Page">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // स्क्रिनको साइज अनुसार बुकको साइज अटोमेटिक मिलाउने लजिक
            let bookWidth = 450;
            let bookHeight = 636;

            if (window.innerWidth < 768) {
                // मोबाइलका लागि स्क्रिन अनुसार मिलाइएको
                bookWidth = Math.floor((window.innerWidth * 0.92) / 2);
                bookHeight = Math.floor(bookWidth * 1.414); 
            }

            const flipBook = new St.PageFlip(
                document.getElementById('flipbook'),
                {
                    width: bookWidth, 
                    height: bookHeight, 
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true,
                    usePortrait: false
                }
            );

            // HTML भित्रका डिभहरू (Pages) बाट फ्लिपबुक लोड गर्ने
            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            // साउन्ड फाइल लोड गर्ने (तपाईंको फोल्डर संरचना अनुसार)
            const flipSound = new Audio('images/flip-sound.mp3');

            // पाना पल्टाउँदा (Flip हुँदा) प्रत्येक पटक साउन्डको क्लोन बनाएर बजाउने
            flipBook.on('flip', (e) => {
                const soundInstance = flipSound.cloneNode();
                soundInstance.play().catch(error => {
                    console.log("Audio play error: ", error);
                });
            });

            // पानामा क्लिक गर्दा ठूलो साइजमा जुम भएर देखाउने (Lightbox Functionality)
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-img');
            const closeBtn = document.getElementById('lightbox-close');

            document.querySelectorAll('.page img').forEach(img => {
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    modal.style.display = 'flex';
                    modalImg.src = this.src;
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
        });
    </script>

</body>
</html>
