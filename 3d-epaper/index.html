<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic PDF to Image Flipbook E-Paper</title>
    <!-- External Libraries for PDF rendering and PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; margin: 0; padding: 0; }
        .controls-bar {
            position: absolute; top: 10px; z-index: 999; display: flex;
            gap: 10px; background: rgba(255, 255, 255, 0.9); padding: 6px 15px; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .controls-bar button {
            background-color: #007bff; color: white; border: none; padding: 6px 12px;
            font-size: 14px; border-radius: 5px; cursor: pointer;
        }
        .controls-bar button:hover { background-color: #0056b3; }
        #book-container {
            width: 100%; max-width: 1000px; height: 75vh; margin: 20px auto;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .page {
            background-color: white; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .page img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Loading Status Overlay */
        #loading-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; font-weight: bold; color: #333; font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="text-center py-4 bg-slate-900 text-white shadow-md">
        <h1 class="text-xl md:text-2xl font-bold" id="main-epaper-title">ताजा ई-पेपर लोड र कन्भर्ट हुँदैछ...</h1>
    </div>

    <div style="position: relative; display: flex; justify-content: center;">
        <div class="controls-bar">
            <button onclick="zoomIn()" title="Zoom In">➕ जुम इन</button>
            <button onclick="zoomOut()" title="Zoom Out">➖ जुम आउट</button>
            <button onclick="resetZoom()" title="Reset">🔄 रिसेट</button>
        </div>
    </div>

    <div id="book-container">
        <!-- Loading status inside viewer -->
        <div id="loading-overlay">
            <p id="convert-status">PDF फाइल इमेल/ड्राइभबाट तान्‍दैछ...</p>
        </div>
        <div id="flipbook">
            <!-- Converted JPG pages will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // PDF.js worker setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // यहाँ आफ्नो Google Apps Script को URL राख्नुहोस्
        const SCRIPT_URL = "तपाईंको_गूगल_एप्स_स्क्रिप्ट_यूआरएल_यहाँ_राख्नुहोस्";

        async function loadAndConvertPDF() {
            try {
                const statusText = document.getElementById("convert-status");
                const titleText = document.getElementById("main-epaper-title");

                statusText.innerText = "गुगल ड्राइभबाट नवीनतम PDF खोज्दैछ...";
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (!data.latestPdfUrl) {
                    statusText.innerText = "कुनै पनि PDF फाइल फेला परेन!";
                    return;
                }

                titleText.innerText = `ताजा ई-पेपर: ${data.latestFileName || 'E-Paper'}`;
                statusText.innerText = "PDF डाउनलोड हुँदैछ...";

                // PDF लोड गर्ने
                const loadingTask = pdfjsLib.getDocument(data.latestPdfUrl);
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const flipbook = document.getElementById("flipbook");
                
                // पालैपालो सबै पेजहरूलाई JPG मा कन्भर्ट गर्ने
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    statusText.innerText = `पेज ${pageNum} / ${numPages} JPG मा कन्भर्ट हुँदैछ...`;
                    
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 }); // गुणस्तर मिलाउन स्केल बढाउन वा घटाउन सकिन्छ
                    
                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    // क्याभासलाई JPG इमेजमा बदल्ने
                    const imgUrl = canvas.toDataURL("image/jpeg", 0.9);

                    // फ्लिपबुकको लागि पेज एलिमेन्ट तयार गर्ने
                    const pageDiv = document.createElement("div");
                    pageDiv.className = "page";
                    
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    pageDiv.appendChild(img);
                    
                    flipbook.appendChild(pageDiv);
                }

                // सबै कन्भर्ट भएपछि लोडिङ हटाएर Flipbook सुरु गर्ने
                document.getElementById("loading-overlay").style.display = "none";

                const pageFlip = new St.PageFlip(document.getElementById("flipbook"), {
                    width: 450,
                    height: 600,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll(".page"));

            } catch (error) {
                console.error("Error processing PDF:", error);
                document.getElementById("convert-status").innerText = "कन्भर्ट गर्दा त्रुटी भयो! कृपया CORS वा फाइल लिङ्क जाँच्नुहोस्।";
            }
        }

        // जुम कन्ट्रोलहरू
        let currentScale = 1;
        function zoomIn() {
            currentScale += 0.2;
            document.getElementById("book-container").style.transform = `scale(${currentScale})`;
        }
        function zoomOut() {
            if (currentScale > 0.6) currentScale -= 0.2;
            document.getElementById("book-container").style.transform = `scale(${currentScale})`;
        }
        function resetZoom() {
            currentScale = 1;
            document.getElementById("book-container").style.transform = `scale(1)`;
        }

        // पेज लोड हुनेबित्तिकै प्रक्रिया सुरु गर्ने
        window.addEventListener("DOMContentLoaded", loadAndConvertPDF);
    </script>
</body>
</html>
