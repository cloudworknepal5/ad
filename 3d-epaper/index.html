<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital E-Paper Flipbook - Perfect View</title>
    <!-- PageFlip Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* माथिल्लो कन्ट्रोल बटनहरूको स्टाइल */
        .controls-bar {
            position: absolute;
            top: 10px;
            z-index: 999;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .controls-bar button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .controls-bar button:hover {
            background-color: #0056b3;
        }

        #viewport-wrapper {
            width: 100vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        #viewport-wrapper:active {
            cursor: grabbing;
        }

        #book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
</head>
<body>

    <!-- जुम इन/आउट कन्ट्रोल बटनहरू -->
    <div class="controls-bar">
        <button onclick="zoomIn()" title="Zoom In">➕ जुम इन</button>
        <button onclick="zoomOut()" title="Zoom Out">➖ जुम आउट</button>
        <button onclick="resetZoom()" title="Reset">🔄 रिसेट</button>
    </div>

    <!-- प्यान (सार्न मिल्ने) एरिया -->
    <div id="viewport-wrapper">
        <div id="book-container">
            <div id="flipbook">
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_1.png" alt="Cover Page">
                </div>
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_2.png" alt="Page 2">
                </div>
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_3.png" alt="Page 3">
                </div>
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_4.png" alt="Page 4">
                </div>
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_5.png" alt="Page 5">
                </div>
                <div class="page">
                    <img src="https://ad.neelamb.com/3d-epaper/image/Page_6.png" alt="Page 6">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentScale = 1;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX, startY;
        let flipBook;

        const container = document.getElementById('book-container');
        const wrapper = document.getElementById('viewport-wrapper');

        function updateTransform() {
            container.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
        }

        // Multi-function: जुम कन्ट्रोलका सबै अपरेसनहरू एउटै फंक्शनबाट ह्यान्डल गर्ने
        function handleZoom(action) {
            if (action === 'in') {
                if (currentScale < 3.5) {
                    currentScale += 0.3;
                    updateTransform();
                }
            } else if (action === 'out') {
                if (currentScale > 1) {
                    currentScale -= 0.3;
                    if (currentScale <= 1) {
                        handleZoom('reset');
                    } else {
                        updateTransform();
                    }
                }
            } else if (action === 'reset') {
                currentScale = 1;
                posX = 0;
                posY = 0;
                updateTransform();
            }

            // जुम गरिएको बेला पेज फ्लिप गर्ने सुविधा बन्द गर्ने (ताकि सार्दा पेज नपल्टियोस्)
            if (flipBook) {
                if (currentScale > 1) {
                    flipBook.turnToPage(flipBook.getCurrentPageIndex()); // फ्लिप रोक्न
                }
            }
        }

        function zoomIn() { handleZoom('in'); }
        function zoomOut() { handleZoom('out'); }
        function resetZoom() { handleZoom('reset'); }

        // माउस ड्रग सपोर्ट
        wrapper.addEventListener('mousedown', (e) => {
            if (currentScale > 1) {
                isDragging = true;
                startX = e.clientX - posX;
                startY = e.clientY - posY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // मोबाइल टच ड्रग सपोर्ट
        wrapper.addEventListener('touchstart', (e) => {
            if (currentScale > 1 && e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - posX;
                startY = e.touches[0].clientY - posY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            posX = e.touches[0].clientX - startX;
            posY = e.touches[0].clientY - startY;
            updateTransform();
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        document.addEventListener('DOMContentLoaded', function () {
            let screenWidth = window.innerWidth;
            let screenHeight = window.innerHeight;
            let bookWidth, bookHeight;

            if (screenWidth < 768) {
                // मोबाइलका लागि स्क्रिन अनुसार म्याच हुने साइज
                bookWidth = Math.floor((screenWidth * 0.95) / 2);
                bookHeight = Math.floor(bookWidth * 1.414);
            } else {
                // डेस्कटपका लागि फुल साइज (स्क्रिनको उचाइको ८२%)
                bookHeight = Math.floor(screenHeight * 0.82);
                bookWidth = Math.floor(bookHeight / 1.414);
            }

            flipBook = new St.PageFlip(
                document.getElementById('flipbook'),
                {
                    width: bookWidth, 
                    height: bookHeight, 
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true,
                    usePortrait: false
                }
            );

            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            const flipSound = new Audio('https://ad.neelamb.com/3d-epaper/image/flip-sound.mp3');
            
            flipBook.on('flip', (e) => {
                // जुम नभएको अवस्थामा मात्र साउन्ड र फ्लिप हुने
                if (currentScale === 1) {
                    const soundInstance = flipSound.cloneNode();
                    soundInstance.play().catch(error => {
                        console.log("Audio play error: ", error);
                    });
                }
            });
        });
    </script>

</body>
</html>
