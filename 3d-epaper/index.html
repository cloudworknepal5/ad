<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital E-Paper Flipbook with Zoom Icon & Sound</title>
    <!-- PageFlip Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #book-container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* आइग्लास (जुम) आइकनको स्टाइल */
        .zoom-icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
            transition: background 0.3s;
        }
        .zoom-icon:hover {
            background-color: rgba(0, 0, 0, 0.85);
        }

        /* लाइटबक्स (जुम गरेर ठूलो देखाउने मोडल) स्टाइल */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }
        #lightbox-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* मोबाइल र साना स्क्रिनहरूको लागि रेस्पोन्सिभ व्यवस्था */
        @media (max-width: 768px) {
            #book-container {
                width: 100vw;
                height: 75vh;
            }
        }
    </style>
</head>
<body>

    <div id="book-container">
        <div id="flipbook">
            <!-- प्रत्येक पेजभित्र तस्बिर र जुम (आइग्लास) आइकन राखिएको छ -->
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_1.png" alt="Cover Page">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom"><i class="fas fa-search-plus"></i>🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_2.png" alt="Page 2">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_3.png" alt="Page 3">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_4.png" alt="Page 4">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_5.png" alt="Page 5">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
            <div class="page">
                <img src="https://ad.neelamb.com/3d-epaper/image/Page_6.png" alt="Page 6">
                <div class="zoom-icon" onclick="openZoom(this)" title="Zoom">🔍</div>
            </div>
        </div>
    </div>

    <!-- फोटो ठूलो देखाउने मोडल (Lightbox) -->
    <div id="lightbox-modal">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Page">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // स्क्रिनको साइज अनुसार बुकको साइज अटोमेटिक मिलाउने लजिक
            let bookWidth = 450;
            let bookHeight = 636;

            if (window.innerWidth < 768) {
                bookWidth = Math.floor((window.innerWidth * 0.92) / 2);
                bookHeight = Math.floor(bookWidth * 1.414); 
            }

            const flipBook = new St.PageFlip(
                document.getElementById('flipbook'),
                {
                    width: bookWidth, 
                    height: bookHeight, 
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true,
                    usePortrait: false
                }
            );

            // पेजहरू लोड गर्ने
            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            // साउन्ड फाइल लोड गर्ने
            const flipSound = new Audio('images/flip-sound.mp3');

            // पाना पल्टाउँदा साउन्ड बजाउने
            flipBook.on('flip', (e) => {
                const soundInstance = flipSound.cloneNode();
                soundInstance.play().catch(error => {
                    console.log("Audio play error: ", error);
                });
            });
        });

        // आइग्लास आइकनमा क्लिक गरेपछि जुम भएर ठूलो देखाउने फंक्सन
        function openZoom(iconElement) {
            const pageDiv = iconElement.closest('.page');
            const imgElement = pageDiv.querySelector('img');
            
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-img');
            
            modal.style.display = 'flex';
            modalImg.src = imgElement.src;
        }

        // बन्द गर्ने लजिक
        document.getElementById('lightbox-close').addEventListener('click', function() {
            document.getElementById('lightbox-modal').style.display = 'none';
        });

        document.getElementById('lightbox-modal').addEventListener('click', function(e) {
            if(e.target === this) {
                this.style.display = 'none';
            }
        });
    </script>

</body>
</html>
